
{% extends "base.html" %}

{% block title %}Вход — Автозапчасти{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h3 mb-4">Вход в аккаунт</h1>

                <form method="post">
                    {% csrf_token %}

                    {% include "_form_fields.html" %}

                    <input type="hidden"
                           name="next"
                           value="{{ next }}">

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Войти
                    </button>

                </form>

                <p class="mt-3 text-center">
                    Нет аккаунта?
                    <a href="{% url 'signup' %}">
                        Зарегистрироваться
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
