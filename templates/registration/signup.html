
{% extends "base.html" %}

{% block title %}Регистрация — Автозапчасти{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h3 mb-4">Регистрация</h1>

                <form method="post" novalidate>
                    {% csrf_token %}

                    {% include "_form_fields.html" %}

                    <button type="submit"
                            class="btn btn-success w-100">
                        Зарегистрироваться
                    </button>

                </form>

                <p class="mt-3 text-center">
                    Уже есть аккаунт?
                    <a href="{% url 'login' %}">
                        Войти
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
