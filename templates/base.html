{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Автозапчасти{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/shop.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'catalog:part_list' %}">Автозапчасти</a>
      <form class="d-flex ms-auto" method="get" action="{% url 'catalog:part_list' %}">
        <input class="form-control form-control-sm me-2" type="search" name="q"
               value="{{ request.GET.q }}" placeholder="Поиск запчастей">
        <button class="btn btn-outline-light btn-sm" type="submit">Найти</button>
      </form>
    </div>
  </nav>

  <div class="bg-light border-bottom mb-4">
    <div class="container">
      <ul class="nav">
        {% for nav_category in nav_categories %}
          <li class="nav-item">
            <a class="nav-link" href="{{ nav_category.get_absolute_url }}">{{ nav_category.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>

  <main class="container mb-5">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
        {{ message }}
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
